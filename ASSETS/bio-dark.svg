<svg width="800" height="432" viewBox="0 0 800 432" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="432" rx="14" fill="#0A192F"/>
<text x="34" y="34" font-family="SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#4A5568">$ whoami</text>
<text x="34" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#64FFDA">Hi, there! &#9825;</text>
<text x="34" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">You can call me <tspan fill="#64FFDA" font-weight="700">Nicole</tspan>. I'm an Electronics Engineering graduate currently</text>
<text x="34" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">exploring AI Automation, Cloud, Networking, Cybersecurity, and Data</text>
<text x="34" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">Engineering. I enjoy learning how technology works, figuring out how things</text>
<text x="34" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">can be improved, and turning ideas into practical solutions.</text>
<text x="34" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">I'm currently an <tspan fill="#64FFDA" font-weight="700">AWS re/Start Scholar</tspan>, building my skills in cloud computing,</text>
<text x="34" y="226" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">Linux, networking, and AWS technologies.</text>
<text x="34" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">Outside of code, networking, and all things tech, you'll probably find me</text>
<text x="34" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">reading self-help or fantasy books, watching sci-fi, romance, and fantasy</text>
<text x="34" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">movies, or designing whatever cute and aesthetic idea randomly pops into my</text>
<text x="34" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">head. Canva and Notion are my go-to creative spaces!</text>
<text x="34" y="366" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">I don't really like coffee or tea, but give me a frappe and I'm happy. I also</text>
<text x="34" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">love window shopping and obsessing over pretty things I probably won't buy</text>
<text x="34" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#B8C4E0">anyway.</text>
</svg>